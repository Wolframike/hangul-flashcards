<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>ハングル読み練習</title>
<script>try { if (localStorage.getItem('hangul-cards:theme') === '"light"') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<style>
/* base.css — openai 規則の値の正本。RULES.md と完全に一致させる。
   使い方: ページの <style> の先頭に、省略せず変えずに写す。部品の CSS はこの後ろに足す。 */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fill: #f3f3f3; --fill-strong: #e8e8e8; --raised: #ffffff; --selected: #ffffff;
  --text: #000000; --text-2: #666666;
  --border: #e0e0e0; --border-strong: #cccccc; --border-input: #8f8f8f;
  --ink: #000000; --focus: #000000;
  --cat1-tint: #eaf2fd; --cat1: #1f4e94;
  --cat2-tint: #f2eefb; --cat2: #5a3e9e;
  --cat3-tint: #e8f5ec; --cat3: #1d6b3b;
  --warn-tint: #fff0e5; --warn: #8f3b00;
  --error-tint: #fdecea; --error: #b42318;
  --highlight: #f6d247; --highlight-hover: #e8c33a; --on-highlight: #000000; --highlight-tint: #fdf3c4;
  --backdrop: rgba(0, 0, 0, .4);
  --shadow-composer: 0 3px 6px rgba(0, 0, 0, .04), 0 4px 80px 8px rgba(0, 0, 0, .04);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 12px; --r-lg: 20px; --r-xl: 24px; --r-pill: 9999px;
  --ease: cubic-bezier(.4, 0, .2, 1); --ease-out: cubic-bezier(0, .56, .46, 1);
  --gutter: 32px; --measure: 720px; --wide: 1200px; --aside: clamp(440px, 50%, 880px); --nav: 240px; --rail: 80px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --fill: #1f1f1f; --fill-strong: #2b2b2b; --raised: #1f1f1f; --selected: #2b2b2b;
    --text: #ffffff; --text-2: #a3a3a3;
    --border: #333333; --border-strong: #4d4d4d; --border-input: #6b6b6b;
    --ink: #ffffff; --focus: #ffffff;
    --cat1-tint: #0f2541; --cat1: #a4cdfb;
    --cat2-tint: #251d3d; --cat2: #c7b8f5;
    --cat3-tint: #0f2c1b; --cat3: #95d5aa;
    --warn-tint: #3a1f0c; --warn: #ffb27a;
    --error-tint: #3b1310; --error: #ff9e94;
    --highlight: #f6d247; --highlight-hover: #e8c33a; --on-highlight: #000000; --highlight-tint: #3a3212;
    --backdrop: rgba(0, 0, 0, .7);
    --shadow-composer: none;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --fill: #1f1f1f; --fill-strong: #2b2b2b; --raised: #1f1f1f; --selected: #2b2b2b;
  --text: #ffffff; --text-2: #a3a3a3;
  --border: #333333; --border-strong: #4d4d4d; --border-input: #6b6b6b;
  --ink: #ffffff; --focus: #ffffff;
  --cat1-tint: #0f2541; --cat1: #a4cdfb;
  --cat2-tint: #251d3d; --cat2: #c7b8f5;
  --cat3-tint: #0f2c1b; --cat3: #95d5aa;
  --warn-tint: #3a1f0c; --warn: #ffb27a;
  --error-tint: #3b1310; --error: #ff9e94;
  --highlight: #f6d247; --highlight-hover: #e8c33a; --on-highlight: #000000; --highlight-tint: #3a3212;
  --backdrop: rgba(0, 0, 0, .7);
  --shadow-composer: none;
}
@media (max-width: 767px) { :root { --gutter: 16px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.75 var(--font); letter-spacing: .02em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
ul, ol { padding-left: 1.25em; }
li + li { margin-top: var(--s1); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::placeholder { color: var(--text-2); opacity: 1; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }

/* 文字の段階（RULES.md「トークン」の文字） */
.t-hero { font-size: 48px; line-height: 1.25; font-weight: 500; letter-spacing: 0; font-feature-settings: "palt"; text-wrap: balance; word-break: auto-phrase; }
.t-h2 { font-size: 30px; line-height: 1.35; font-weight: 500; letter-spacing: 0; font-feature-settings: "palt"; text-wrap: balance; word-break: auto-phrase; }
.t-h3 { font-size: 22px; line-height: 1.4; font-weight: 500; letter-spacing: 0; font-feature-settings: "palt"; text-wrap: balance; word-break: auto-phrase; }
.t-title { font-size: 18px; line-height: 1.4; font-weight: 500; letter-spacing: 0; font-feature-settings: "palt"; }
.t-lead { font-size: 18px; line-height: 1.7; font-weight: 400; letter-spacing: .02em; text-wrap: pretty; }
.t-body { font-size: 16px; line-height: 1.75; font-weight: 400; letter-spacing: .02em; text-wrap: pretty; line-break: strict; }
.t-brand { font-size: 16px; line-height: 1.4; font-weight: 500; letter-spacing: 0; }
.t-ui { font-size: 14px; line-height: 1.4; font-weight: 500; letter-spacing: .01em; }
.t-data { font-size: 14px; line-height: 1.5; font-weight: 400; letter-spacing: .01em; }
.t-small { font-size: 13px; line-height: 1.6; font-weight: 400; letter-spacing: .01em; }
.t-caption { font-size: 12px; line-height: 1.5; font-weight: 400; letter-spacing: .01em; }
.t-mono { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; letter-spacing: 0; }
@media (max-width: 767px) { .t-hero { font-size: 32px; } .t-h2 { font-size: 24px; } .t-h3 { font-size: 20px; } }

/* アイコン。Material Symbols の公式 SVG を <symbol id="i-名前"> でページに入れ、<svg class="icon" aria-hidden="true"><use href="#i-名前"/></svg> で描く */
.icon { width: 20px; height: 20px; flex: none; fill: currentColor; vertical-align: middle; }

/* ボタン */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 40px; padding: 0 20px; border: 1px solid transparent; border-radius: var(--r-pill); font-size: 14px; line-height: 1; font-weight: 500; letter-spacing: .01em; white-space: nowrap; text-decoration: none; transition: background-color .2s linear, border-color .2s linear, color .2s linear; }
.btn .icon { width: 18px; height: 18px; }
.btn-sm { height: 36px; padding: 0 16px; }
.btn-primary { background: var(--highlight); color: var(--on-highlight); }
.btn-primary:hover { background: var(--highlight-hover); }
.btn-secondary { background: var(--fill); color: var(--text); }
.btn-secondary:hover { background: var(--fill-strong); }
.btn-danger { background: var(--fill); color: var(--error); }
.btn-danger:hover { background: var(--fill-strong); }
.btn-icon { width: 36px; height: 36px; padding: 0; background: transparent; color: var(--text); }
.btn-icon:hover { background: var(--fill); }
.btn-icon.btn-xs { width: 24px; height: 24px; color: var(--text-2); }
.btn-icon.btn-xs .icon { width: 18px; height: 18px; }
.btn-icon.btn-xs:hover { background: var(--fill-strong); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--fill-strong); color: var(--text-2); cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }

/* チップ・切替・絞り込みの行 */
.chip { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 16px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: transparent; color: var(--text); font-size: 14px; line-height: 1.5; font-weight: 500; letter-spacing: .01em; text-align: left; word-break: auto-phrase; transition: background-color .2s linear; }
.chip:hover { background: var(--fill); }
.toggle { display: inline-flex; align-items: center; gap: var(--s1); height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: transparent; color: var(--text-2); font-size: 13px; line-height: 1; font-weight: 500; white-space: nowrap; transition: background-color .2s linear, border-color .2s linear, color .2s linear; }
.toggle .icon { display: none; width: 16px; height: 16px; }
.toggle[aria-pressed="true"] { background: var(--fill-strong); border-color: var(--fill-strong); color: var(--text); }
.toggle[aria-pressed="true"] .icon { display: inline-block; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); }
.toolbar .search { flex: 1 1 280px; }
.filter { display: inline-flex; align-items: center; gap: var(--s2); }
.filter > label { color: var(--text-2); font-size: 13px; line-height: 1.4; white-space: nowrap; }

/* 入力とフォーム、入力と送信の面 */
.field { width: 100%; height: 40px; padding: 0 16px; border: 1px solid var(--border-input); border-radius: var(--r-pill); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; transition: border-color .2s linear, box-shadow .2s linear; }
.field:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.field[aria-invalid="true"] { border-color: var(--error); }
textarea.field { height: auto; min-height: 96px; padding: 10px 16px; border-radius: var(--r-md); resize: vertical; }
.field-sm { height: 36px; padding-left: 14px; }
.select { position: relative; display: inline-flex; align-items: center; }
.select select { appearance: none; padding-right: 40px; background: var(--fill); cursor: pointer; }
.select .icon { position: absolute; right: 12px; pointer-events: none; }
.search { position: relative; display: flex; align-items: center; }
.search .field { padding-left: 44px; }
.search .icon { position: absolute; left: 16px; color: var(--text-2); pointer-events: none; }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--ink); flex: none; }
.form { display: grid; gap: var(--s5); }
.form-row { display: grid; gap: var(--s2); }
.form-label { font-size: 14px; line-height: 1.4; font-weight: 500; }
.form-help { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.check-row { display: flex; align-items: flex-start; gap: var(--s3); }
.check-row .form-label { line-height: 1.75; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; }
.composer { display: flex; align-items: flex-end; gap: var(--s2); min-height: 56px; padding: 8px 8px 8px 20px; border: 1px solid var(--border-input); border-radius: var(--r-xl); background: var(--raised); box-shadow: var(--shadow-composer); transition: border-color .2s linear, box-shadow .2s linear; }
.composer:focus-within { border-color: var(--text); box-shadow: 0 0 0 1px var(--text), var(--shadow-composer); }
.composer textarea { flex: 1; min-width: 0; max-height: 192px; padding: 8px 0; border: 0; outline: none; background: transparent; color: var(--text); font-size: 16px; line-height: 24px; resize: none; }
.composer .btn-send { width: 36px; height: 36px; padding: 0; border: 0; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; background: var(--highlight); color: var(--on-highlight); transition: background-color .2s linear; }
.composer .btn-send:hover { background: var(--highlight-hover); }
.composer .btn-send:disabled { background: var(--fill-strong); color: var(--text-2); cursor: not-allowed; }

/* 知らせ・空の状態・読み込み中 */
.banner { display: flex; justify-content: center; align-items: flex-start; gap: var(--s2); padding: 8px 16px; background: var(--fill); color: var(--text); font-size: 13px; line-height: 1.6; text-align: center; }
.banner .icon { color: var(--text-2); }
.notice { display: flex; align-items: flex-start; gap: var(--s2); padding: 12px 16px; border-radius: var(--r-md); background: var(--fill); color: var(--text); font-size: 13px; line-height: 1.6; }
.notice-warn { background: var(--warn-tint); color: var(--warn); }
.notice-error { background: var(--error-tint); color: var(--error); }
.notice-title { display: block; font-size: 14px; line-height: 1.5; font-weight: 500; }
.notice ul { margin: 0; padding-left: 20px; }
.notice li + li { margin-top: var(--s1); }
.notice-toggle { display: inline-flex; align-items: center; gap: var(--s1); height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: transparent; color: var(--warn); font-size: 13px; line-height: 1; font-weight: 500; white-space: nowrap; transition: background-color .2s linear, border-color .2s linear; }
.notice-toggle:hover { background: var(--fill); }
.notice-toggle.is-new { border-color: var(--warn-tint); background: var(--warn-tint); }
.notice-toggle .icon { width: 16px; height: 16px; }
.notice-toggle .icon:last-child { transition: transform .3s var(--ease); }
.notice-toggle[aria-expanded="true"] .icon:last-child { transform: rotate(180deg); }
.menu-toggle { display: inline-flex; align-items: center; gap: var(--s1); height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: transparent; color: var(--text); font-size: 13px; line-height: 1; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color .2s linear; }
.menu-toggle:hover { background: var(--fill); }
.menu-toggle .icon { width: 16px; height: 16px; transition: transform .3s var(--ease); }
.menu-toggle[aria-expanded="true"] .icon { transform: rotate(180deg); }
.say { display: flex; align-items: flex-start; gap: var(--s1); font-size: 13px; line-height: 1.6; color: var(--text-2); }
.say-warn { color: var(--warn); }
.say-error { color: var(--error); }
.say .icon { width: 18px; height: 18px; margin-top: 2px; }
.disclaimer { padding: 8px 16px; font-size: 12px; line-height: 1.5; color: var(--text-2); text-align: center; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s7) 0; text-align: center; }
.empty-text { font-size: 14px; line-height: 1.6; color: var(--text-2); }
.empty .chips, .empty .actions { justify-content: center; margin-top: var(--s4); }
.loading { display: flex; justify-content: center; align-items: center; gap: var(--s2); padding: var(--s7) 0; color: var(--text-2); font-size: 13px; line-height: 1.6; }
.dots { display: inline-flex; align-items: center; gap: var(--s1); }
.dots i { width: 6px; height: 6px; border-radius: var(--r-pill); background: currentColor; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

/* ラベル・一覧・表・カード・手順・折りたたみ・リンク */
.tag { display: inline-block; padding: 0 6px; border-radius: var(--r-xs); background: var(--fill); color: var(--text); font-size: 12px; line-height: 20px; font-weight: 500; letter-spacing: 0; white-space: nowrap; }
.tag-cat1 { background: var(--cat1-tint); color: var(--cat1); }
.tag-cat2 { background: var(--cat2-tint); color: var(--cat2); }
.tag-cat3 { background: var(--cat3-tint); color: var(--cat3); }
.tag-warn { background: var(--warn-tint); color: var(--warn); }
.list { margin: 0; padding: 0; list-style: none; }
.list > li + li { margin-top: 0; }
.list-row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-main { flex: 1; min-width: 0; }
.list-title { font-size: 14px; line-height: 1.5; font-weight: 500; }
.list-meta { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.box { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); overflow: hidden; }
.box-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); padding: 12px 16px; font-size: 13px; line-height: 1.6; font-weight: 500; }
.box-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); padding: 10px 16px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.6; }
.table-wrap { position: relative; width: 100%; overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; letter-spacing: .01em; }
.table th { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 13px; font-weight: 500; text-align: left; white-space: nowrap; }
.table td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th:first-child, .table td:first-child { padding-left: 0; }
.table th:last-child, .table td:last-child { padding-right: 0; }
.table .col-num { text-align: right; font-variant-numeric: tabular-nums; }
.table-dense td { padding-top: 8px; padding-bottom: 8px; }
.table thead th { position: sticky; top: 0; z-index: 1; }
.table th button { display: inline-flex; align-items: center; gap: var(--s1); padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.table th button .icon { width: 16px; height: 16px; }
.table th[aria-sort] button { color: var(--text); }
.c-cat1 { color: var(--cat1); } .c-cat2 { color: var(--cat2); } .c-cat3 { color: var(--cat3); } .c-warn { color: var(--warn); } .c-error { color: var(--error); }
.card { padding: var(--s5); border-radius: var(--r-sm); background: var(--fill); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s5); margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps > li { margin: 0; counter-increment: step; }
.steps > li::before { content: counter(step); display: block; margin-bottom: var(--s2); color: var(--text-2); font-size: 14px; line-height: 1.4; font-weight: 500; font-variant-numeric: tabular-nums; }
.steps > li > * + * { margin-top: var(--s2); }
.card > * + * { margin-top: var(--s2); }
details > summary { display: flex; align-items: center; gap: var(--s1); list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary .icon { transition: transform .3s var(--ease); }
details[open] > summary .icon { transform: rotate(180deg); }
.faq > details { border-top: 1px solid var(--border); }
.faq > details:last-child { border-bottom: 1px solid var(--border); }
.faq summary { justify-content: space-between; padding: 16px 0; font-size: 16px; line-height: 1.6; font-weight: 500; }
.faq details > div { padding: 0 0 16px; color: var(--text-2); }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; transition: color .2s linear; }
a:hover { color: var(--text-2); }
a.btn, .nav a, .side-nav a, a.brand { text-decoration: none; }
a.btn-primary:hover { color: var(--on-highlight); }
a.btn-secondary:hover { color: var(--text); }

/* ナビゲーション・タブ・ダイアログ */
.site-header { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); height: 64px; padding: 0 var(--gutter); }
.nav { display: flex; align-items: center; gap: var(--s5); }
.nav a { color: var(--text-2); font-size: 14px; line-height: 1.4; font-weight: 500; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--text); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: var(--s2); height: 40px; padding: 0 12px; border-radius: var(--r-pill); color: var(--text-2); font-size: 14px; line-height: 1; font-weight: 500; }
.side-nav a:hover { color: var(--text); }
.side-nav a[aria-current="page"] { background: var(--fill); color: var(--text); }
.tabs { display: flex; padding: 4px; border-radius: var(--r-pill); background: var(--fill); }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--text-2); font-size: 14px; line-height: 1; font-weight: 500; white-space: nowrap; transition: background-color .2s linear, color .2s linear; }
.tab[aria-selected="true"] { background: var(--selected); color: var(--text); }
dialog { width: min(480px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: var(--s5); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); color: var(--text); }
dialog::backdrop { background: var(--backdrop); }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); margin-top: var(--s5); }

/* アプリの外枠の部品（利用者の部品、縦のメニュー、面のタブ、ドラッグ&ドロップ、メニュー） */
.header-actions { display: flex; align-items: center; gap: var(--s2); }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-pill); background: var(--fill-strong); color: var(--text); font-size: 14px; line-height: 1; font-weight: 500; }
.avatar-button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: var(--r-pill); background: transparent; }
.avatar-button:hover { background: var(--fill); }
.rail { display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding: var(--s3) 0; border-right: 1px solid var(--border); }
.rail-item { display: flex; flex-direction: column; align-items: center; gap: var(--s1); width: 64px; padding: var(--s1) 0; border: 0; background: none; color: var(--text-2); font-size: 12px; line-height: 1.4; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer; transition: color .2s linear; }
.rail-item:hover { color: var(--text); }
.rail-mark { display: flex; align-items: center; justify-content: center; width: 56px; height: 32px; border-radius: var(--r-pill); transition: background-color .2s linear; }
.rail-item:hover .rail-mark { background: var(--fill); }
.rail-item .icon { width: 24px; height: 24px; }
.rail-item.is-open { color: var(--text); }
.rail-item.is-open .rail-mark { background: var(--highlight); color: var(--on-highlight); }
.panel-tabs { display: flex; align-items: flex-end; gap: var(--s2); min-height: 48px; padding: 0 var(--s4); border-bottom: 1px solid var(--border); }
.panel-tab-group { display: inline-flex; align-items: center; gap: var(--s1); height: 40px; border-bottom: 2px solid transparent; }
.panel-tab-group:has([aria-selected="true"]) { border-bottom-color: var(--ink); }
.panel-tab { display: inline-flex; align-items: center; gap: var(--s2); height: 36px; padding: 0 var(--s1); border: 0; border-radius: var(--r-sm); background: none; color: var(--text-2); font-size: 14px; line-height: 1; font-weight: 500; white-space: nowrap; cursor: grab; }
.panel-tab[aria-selected="true"] { color: var(--text); }
.panel-tab:hover { background: var(--fill); }
.is-dragging { opacity: .4; }
.drop-zone { position: absolute; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s5); border: 2px dashed var(--text-2); border-radius: var(--r-md); background: var(--highlight-tint); color: var(--text); font-size: 14px; line-height: 1.5; font-weight: 500; text-align: center; pointer-events: none; }
.drop-zone .icon { width: 24px; height: 24px; }
.drop-zone.is-over { border-style: solid; border-color: var(--text); }
.has-menu { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; min-width: 240px; padding: var(--s1); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); color: var(--text); }
.menu-label { padding: var(--s2) var(--s3) var(--s1); color: var(--text-2); font-size: 12px; line-height: 1.5; }
.menu-item { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: 40px; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm); background: none; color: var(--text); font-size: 14px; line-height: 1.4; font-weight: 500; text-align: left; text-decoration: none; cursor: pointer; }
.menu-item:hover { background: var(--fill); }
.menu-item[aria-disabled="true"] { color: var(--text-2); background: none; cursor: not-allowed; }
.menu-item .menu-end { margin-left: auto; }
.menu-text { display: flex; flex-direction: column; min-width: 0; padding: 6px 0; }
.menu-sub { color: var(--text-2); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; font-weight: 400; letter-spacing: 0; overflow-wrap: anywhere; }
.menu-sub:empty { display: none; }
.menu-sep { height: 1px; margin: var(--s1) 0; background: var(--border); }
/* 格子と幅 */
.container { width: 100%; max-width: calc(var(--wide) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
.measure { width: 100%; max-width: var(--measure); margin-left: auto; margin-right: auto; }
.section { padding: var(--s9) 0; }
.section-head { margin-bottom: var(--s5); }
.stack > * + * { margin-top: var(--s4); }
.prose > * + * { margin-top: var(--s5); }
.prose > h2, .prose > h3 { margin-top: var(--s7); }
.prose > h2 + *, .prose > h3 + * { margin-top: var(--s4); }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5); margin-top: var(--s7); }
.pager > :last-child { text-align: right; }
.pager-label { display: block; margin-bottom: var(--s1); color: var(--text-2); font-size: 13px; line-height: 1.6; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5); }
.site-footer { border-top: 1px solid var(--border); padding: var(--s7) 0; }
.site-footer .disclaimer { padding: 0; text-align: left; }
.app { display: flex; flex-direction: column; height: 100dvh; }
.app-frame { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.app-body { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.app[data-layout="split"] .app-body { grid-template-columns: minmax(0, 1fr) var(--aside); }
.app[data-layout="full"] .side-panel { display: none; }
.pane { position: relative; min-width: 0; min-height: 0; overflow-y: auto; }
.side-panel { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
.side-panel > .pane { flex: 1; }
.split-handle { display: none; position: absolute; top: 0; bottom: 0; right: calc(var(--aside) - 6px); z-index: 3; width: 12px; align-items: center; justify-content: center; cursor: col-resize; touch-action: none; }
.app[data-layout="split"] .split-handle { display: flex; }
.split-handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); }
.split-handle:hover::before, .split-handle:focus-visible::before, .is-resizing .split-handle::before { background: var(--border-input); }
.split-handle:focus-visible { outline: none; }
.split-grip { position: relative; display: flex; align-items: center; justify-content: center; width: 16px; height: 40px; border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: var(--bg); color: var(--text-2); }
.split-handle:focus-visible .split-grip { border: 2px solid var(--focus); }
.split-grip .icon { width: 16px; height: 16px; }
.is-resizing { cursor: col-resize; user-select: none; }
.with-nav { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); gap: var(--s7); }
@media (max-width: 1023px) {
  .app[data-layout] .app-body { grid-template-columns: minmax(0, 1fr); }
  .app-body > :not(.is-current) { display: none !important; }
  .app[data-layout="full"] .side-panel.is-current { display: flex; }
  .side-panel { border-left: 0; }
  .with-nav { grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
  .side-nav { flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
}
@media (max-width: 767px) {
  .app-frame { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .rail { grid-row: 2; flex-direction: row; justify-content: space-around; padding: var(--s1) 0; border-right: 0; border-top: 1px solid var(--border); }
  .site-header { height: 56px; }
  .section { padding: var(--s8) 0; }
  .grid-2, .grid-3, .pager { grid-template-columns: minmax(0, 1fr); }
  .pager > :last-child { text-align: left; }
  .table-wrap .table th, .table-wrap .table td { white-space: nowrap; }
  .table-wrap .table th:first-child, .table-wrap .table td:first-child { width: 160px; min-width: 160px; white-space: normal; }
}

/* 動き */
@keyframes appear { from { opacity: 0; transform: translateY(4px); } }
.appear { animation: appear .3s var(--ease-out); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* 単語カードのページ */
.practice { padding: var(--s6) 0 var(--s8); }
.flashcard { display: block; width: 100%; margin-top: var(--s5); padding: 0; border: 0; border-radius: var(--r-md); background: none; color: var(--text); text-align: center; perspective: 1200px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.flashcard-inner { display: grid; transform-style: preserve-3d; transition: transform .3s var(--ease); }
.flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard.no-anim .flashcard-inner { transition: none; }
.face { grid-area: 1 / 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); min-width: 0; aspect-ratio: 8 / 5; padding: var(--s7) var(--s5); border-radius: var(--r-md); background: var(--fill); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face-back { transform: rotateY(180deg); }
.face-label { position: absolute; top: var(--s4); left: var(--s5); }
.face-hint { position: absolute; right: 0; bottom: var(--s4); left: 0; }
.word { font-size: 72px; line-height: 1.25; font-weight: 500; letter-spacing: 0; word-break: keep-all; overflow-wrap: anywhere; }
.roman, .pron { word-break: keep-all; overflow-wrap: anywhere; }
.meaning { margin-top: var(--s4); overflow-wrap: anywhere; }
.deck-nav { display: flex; justify-content: center; align-items: center; gap: var(--s5); margin-top: var(--s5); }
.nav-btn { width: 40px; padding: 0; touch-action: manipulation; }
.keys { margin-top: var(--s3); text-align: center; }
.hint-touch { display: none; }
@media (hover: none) { .hint-mouse, .keys { display: none; } .hint-touch { display: inline; } }
.mode-tabs { margin-bottom: var(--s5); }

/* 発音テスト */
.test-section { margin-top: var(--s6); }
.test-group { margin-top: var(--s4); }
.test-item { align-items: flex-start; }
.test-ko { word-break: keep-all; overflow-wrap: anywhere; }
.test-pron { margin-top: var(--s1); }
.test-pron > summary { width: fit-content; }
.test-forms { margin-top: var(--s1); }
.test-forms > span { display: block; word-break: keep-all; overflow-wrap: anywhere; }

/* スマホでは、カードを画面の残りの高さまで伸ばす */
@media (max-width: 767px) {
  .practice { display: flex; flex-direction: column; min-height: calc(100vh - 56px); min-height: calc(100dvh - 56px); padding: var(--s4) 0 var(--s5); }
  #cards-view, #study { display: flex; flex: 1; flex-direction: column; }
  .mode-tabs { margin-bottom: var(--s4); }
  .flashcard { display: grid; flex: 1; margin-top: var(--s4); }
  .face { aspect-ratio: auto; min-height: 240px; }
  .word { font-size: 48px; }
  .keys { display: none; }
}
</style>

  showPron: store.get('showPron', false)
};
if (state.set !== 'all' && !SETS.some(s => s.n === state.set)) state.set = 'all';

const card = $('card');
let deck = [];
let pos = 0;
let flipped = false;

function shuffled(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function build() {
  const sets = state.set === 'all' ? SETS : SETS.filter(s => s.n === state.set);
  deck = sets.flatMap(s => s.cards.map(c => Object.assign({ set: s.n }, c)));
  if (state.changed) deck = deck.filter(c => c.chg);
  if (state.shuffle) shuffled(deck);
  go(0);
}

function setFlipped(value) {
  flipped = value;
  card.classList.toggle('is-flipped', flipped);
  $('front').setAttribute('aria-hidden', String(flipped));
  $('back').setAttribute('aria-hidden', String(!flipped));
}

// Move to card i showing its front, without animating the turn back.
function go(i) {
  card.classList.add('no-anim');
  setFlipped(false);
  pos = i;
  render();
  void card.offsetWidth;
  card.classList.remove('no-anim');
}

function render() {
  const finished = deck.length === 0 || pos >= deck.length;
  $('study').hidden = finished;
  $('done').hidden = !finished;
  if (finished) {
    if (deck.length === 0) {
      $('done-title').textContent = '該当する語がありません';
      $('done-text').textContent = '「発音が変わる語だけ」を外すか、別のセットを選んでください。';
      $('done-actions').hidden = true;
    } else {
      $('done-title').textContent = '最後まで終わりました';
      $('done-text').textContent = deck.length + '語を見ました。';
      $('done-actions').hidden = false;
    }
    return;
  }
  const c = deck[pos];
  $('where').textContent = $('where-back').textContent = 'SFC朝鮮語' + c.set;
  $('word').textContent = c.ko;
  $('meaning').textContent = c.ja;
  $('roman').textContent = c.rom.join(' / ');
  $('pron').textContent = c.pron.map(p => '[' + p + ']').join(' / ');
  $('pos').textContent = (pos + 1) + ' / ' + deck.length;
  $('prev').disabled = pos === 0;
}

function next() { if (pos < deck.length) go(pos + 1); }
function prev() { if (pos > 0) go(pos - 1); }

const select = $('set');
select.append(new Option('すべて（' + SETS.reduce((n, s) => n + s.cards.length, 0) + '語）', 'all'));
for (const s of SETS) select.append(new Option('SFC朝鮮語' + s.n + '（' + s.cards.length + '語）', s.n));
select.value = state.set;
select.addEventListener('change', () => { state.set = select.value; store.set('set', state.set); build(); });

for (const key of ['shuffle', 'changed']) {
  const button = $(key);
  button.setAttribute('aria-pressed', String(state[key]));
  button.addEventListener('click', () => {
    state[key] = !state[key];
    store.set(key, state[key]);
    button.setAttribute('aria-pressed', String(state[key]));
    build();
  });
}

const theme = $('theme');
theme.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
theme.addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  theme.setAttribute('aria-pressed', String(dark));
  store.set('theme', dark ? 'dark' : 'light');
});

// Touch: swipe left/right, or tap within EDGE px of the card's left/right edge, to move between cards;
// a tap elsewhere flips it. A click right after a swipe is ignored so it does not also flip.
const EDGE = 64;
let touchStart = null;
let swipedAt = -Infinity;
card.addEventListener('click', () => { if (performance.now() - swipedAt > 500) setFlipped(!flipped); });
card.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = e.touches.length === 1 ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
card.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) >= 50 && Math.abs(dx) >= 2 * Math.abs(dy)) {
    swipedAt = performance.now();
    if (dx < 0) next(); else prev();
  } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    // Edge tap: cancelling touchend stops the click, so the card does not flip.
    const r = card.getBoundingClientRect();
    if (t.clientX > r.right - EDGE) { e.preventDefault(); next(); }
    else if (t.clientX < r.left + EDGE && pos > 0) { e.preventDefault(); prev(); }
  }
});
$('prev').addEventListener('click', prev);
$('next').addEventListener('click', next);
$('restart').addEventListener('click', build);

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || $('cards-view').hidden) return;
  const t = e.target;
  if (t.closest('select, input, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if ((e.key === ' ' || e.key === 'Enter') && !t.closest('button')) {
    e.preventDefault();
    if ($('done').hidden) setFlipped(!flipped);
    else if (!$('done-actions').hidden) build();
  }
});

// 発音テスト: word and meaning always shown, pronunciation in a closed <details>, audio on request.
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const player = new Audio();

function testItem(item, koClass) {
  const li = el('li', 'list-row test-item');
  const main = el('div', 'list-main');
  const ko = el('p', koClass + ' test-ko', item.ko);
  ko.lang = 'ko';
  main.append(ko, el('p', 'list-meta', item.ja));

  const details = el('details', 'test-pron');
  details.open = state.showPron;
  const summary = el('summary', 't-small muted', '発音表記');
  summary.insertAdjacentHTML('beforeend', '<svg class="icon" aria-hidden="true"><use href="#i-expand_more"/></svg>');
  const forms = el('p', 'test-forms');
  const pron = el('span', 't-title', item.pron.map(p => '[' + p + ']').join(' / '));
  pron.lang = 'ko';
  const rom = el('span', 'muted', item.rom.join(' / '));
  rom.lang = 'ko-Latn';
  forms.append(pron, rom);
  details.append(summary, forms);
  if (item.note) details.append(el('p', 't-small muted', item.note));
  main.append(details);
  li.append(main);

  if (item.audio) {
    const listen = el('button', 'btn btn-secondary btn-sm', '聞く');
    listen.setAttribute('aria-label', item.ko + ' を聞く');
    listen.addEventListener('click', () => {
      player.src = 'audio/' + item.id + '.mp3';
      player.play().catch(() => {});
    });
    li.append(listen);
  }
  return li;
}

for (let row = 1; row <= 10; row++) {
  const group = el('div', 'test-group');
  const list = el('ul', 'list');
  for (const item of TESTS.words.filter(w => w.row === row)) list.append(testItem(item, 't-h3'));
  group.append(el('h3', 't-small muted', row + '行目'), list);
  $('test-words').append(group);
}
for (const item of TESTS.sentences) $('test-sentences').append(testItem(item, 't-title'));

const showPron = $('show-pron');
showPron.setAttribute('aria-pressed', String(state.showPron));
showPron.addEventListener('click', () => {
  state.showPron = !state.showPron;
  store.set('showPron', state.showPron);
  showPron.setAttribute('aria-pressed', String(state.showPron));
  for (const d of document.querySelectorAll('.test-pron')) d.open = state.showPron;
});

// Mode tabs; ← → move between them.
const tabs = [$('tab-cards'), $('tab-test')];
function setMode(mode) {
  state.mode = mode;
  store.set('mode', mode);
  for (const tab of tabs) {
    const on = tab.dataset.mode === mode;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    $(tab.getAttribute('aria-controls')).hidden = !on;
  }
  if (mode !== 'test') player.pause();
}
tabs.forEach((tab, i) => {
  tab.addEventListener('click', () => setMode(tab.dataset.mode));
  tab.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    e.stopPropagation();
    const other = tabs[(i + 1) % tabs.length];
    other.focus();
    setMode(other.dataset.mode);
  });
});

setMode(state.mode === 'test' ? 'test' : 'cards');
build();
</script>
</body>
</html>
